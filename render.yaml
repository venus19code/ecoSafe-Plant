services:
  - type: web
    name: ecosafe-plant-api
    runtime: python
    plan: free
    rootDir: ecoSafe-Plant/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Crea tablas y datos de demostración si la base está vacía
      - key: AUTO_INIT_DB
        value: "true"
      # Conexión a MySQL (Railway): se piden al crear el servicio
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Pon "true" si tu MySQL exige conexión cifrada (SSL/TLS)
      - key: DB_SSL
        value: "false"
